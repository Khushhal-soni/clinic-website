    />
    <!--
      Typography: Manrope (headings, navigation, buttons, UI labels) + Inter (body, forms, articles).
      One request, variable-font weight ranges (400–700), display=swap, loaded without blocking first paint.
      Size-adjusted fallback faces in src/index.css keep layout stable while the fonts load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Manrope:wght@400..700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Manrope:wght@400..700&display=swap"
      />
